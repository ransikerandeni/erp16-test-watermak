[project]
name = "ucsc_test_watermark"
authors = [{ name = "UCSC" }]
description = "Shows an 'ERP16-Test Server' watermark on desk pages, print formats and reports (test server only)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
